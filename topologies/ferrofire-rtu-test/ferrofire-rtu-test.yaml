apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: ferrofire-rtu-test
spec:
  nodes:
  # Isolated boot test of the ferrofire Buildroot RTU image (images/ferrofire-rtu.sh). One VM, own vlan, no gateway.
  # The address is waterway rtu-1's, because its generated config.xml (injects/rtu-1-config.xml, copied from
  # /phenix/experiments/waterway/sceptre/rtu-1/config.xml) binds Modbus/DNP3 to 10.1.1.101 and its multicast input to 172.16.1.101 (the mgmt-style NIC on a second isolated vlan).
  - general:
      hostname: rtu-t
      description: ferrofire RTU image boot test
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: ferrofire-rtu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.101
        mask: 24
        proto: static
        type: ethernet
        vlan: FFRT
      - name: mgmt
        address: 172.16.1.101
        mask: 16
        proto: static
        type: ethernet
        vlan: FFRTM
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/ferrofire-rtu-test/injects/rtu-1-config.xml
      dst: /etc/sceptre/config.xml
      description: rtu-1 config.xml
      permissions: '0644'
    - src: /phenix/topologies/ferrofire-rtu-test/injects/sceptre-start.sh
      dst: /etc/phenix/startup/sceptre-start.sh
      description: sceptre-start.sh
      permissions: '0755'
    # ntp.conf mimics what phenix's ntp app writes, so the image's S40ntpd adapter is exercised in this test
    - src: /phenix/topologies/ferrofire-rtu-test/injects/ntp.conf
      dst: /etc/ntp.conf
      description: ntp.conf as phenix's ntp app writes it
      permissions: '0644'
