apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: waterway-mini
spec:
  nodes:
  - general:
      hostname: waterway-provider
      description: Rust simulinksolver + stock bennu-simulink-provider
    hardware: &hw
      cpu: host
      memory: 2048
      vcpus: 2
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: linux
    advanced: &adv
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 172.16.1.2
        mask: 16
        name: mgmt
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-1
      description: SCEPTRE RTU
    hardware: *hw
    advanced: *adv
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 10.1.1.101
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: ICS
      - address: 172.16.1.101
        mask: 16
        name: mgmt
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
