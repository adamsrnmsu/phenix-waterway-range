apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: ign-amd64
spec:
  nodes:
  - general:
      hostname: x86test
    hardware:
      cpu: max            # phenix emits `vm config cpu` BEFORE advanced (plan 1.1 trap); "max" validates under the default aarch64 qemu too
      memory: 1024
      os_type: linux
      drives:
      - image: ubuntu-amd64.qc2
        interface: virtio
    advanced:
      # no `machine:` (validated against the default aarch64 qemu before `qemu` is applied; x86 default is already pc)
      qemu: /usr/bin/qemu-system-x86_64   # absolute path (a bare name resolves under /phenix/images); TCG: no KVM for a foreign arch
      vga: std
      qemu-append: ""            # drop phenix's `-vga qxl`
    network:
      interfaces:
      - address: 192.168.77.1
        mask: 24
        name: if0
        proto: static
        type: ethernet
        vlan: IGN
    type: VirtualMachine
