apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: router3-arm64
spec:
  nodes:
  - general:
      hostname: hosta
    hardware:
      cpu: host
      drives:
      - image: ubuntu-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: linux
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 10.0.1.10
        mask: 24
        name: if0
        proto: static
        type: ethernet
        vlan: NETA
        gateway: 10.0.1.1
    type: VirtualMachine
  - general:
      hostname: hostb
    hardware:
      cpu: host
      drives:
      - image: ubuntu-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: linux
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 10.0.2.10
        mask: 24
        name: if0
        proto: static
        type: ethernet
        vlan: NETB
        gateway: 10.0.2.1
    type: VirtualMachine
  - general:
      hostname: router
    hardware:
      cpu: host
      drives:
      - image: minirouter-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: minirouter
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 10.0.1.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: NETA
      - address: 10.0.2.1
        mask: 24
        name: IF1
        proto: static
        type: ethernet
        vlan: NETB
    type: Router
