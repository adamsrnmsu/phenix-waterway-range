# Pump station + feeder for the range (ww-1df.10): ferrofire models/pump-station.yaml (spec 3.3) with the tag names the sceptre
# batch-process devices use (pump: flow temperature active control; valve: open; storagetank: tank_level ...), so the stock
# RTU field device can serve every field. Power side: PYPOWER vocabulary, rtu `power-transmission` devices bus/branch/load.
# Opening branch-1_2-3 islands bus 3: voltage 0, the pump motor trips, the tank drains through the orifice.
version: 1
dt: 0.1
params: {tank.area: 50, valve.cv: 0.3, pump.q_nom: 0.5, pump.head: 30}
inputs:
  pump.control:               {type: binary, default: true}
  valve.open:                 {type: binary, default: true}
  storagetank.level_setpoint: {type: analog, default: 5}
  storagetank.fill_control:   {type: binary, default: false}
  storagetank.empty_control:  {type: binary, default: false}
states:
  storagetank.tank_level: {ode: "(pump.flow - valve.flow) / tank.area", init: 2.0, min: 0, max: 10, units: m}
outputs:
  pump.flow:        {type: analog, expr: "pump.control && !`bus-alert`.active && `bus-3`.voltage > 0.9 ? pump.q_nom : 0", units: m3/s}
  pump.active:      {type: binary, expr: "pump.flow > 0"}
  pump.temperature: {type: analog, expr: "20 + 25 * pump.flow / pump.q_nom"}
  valve.flow:       {type: analog, expr: "valve.open * valve.cv * sqrt(max(storagetank.tank_level, 0))", units: m3/s}
  storagetank.flow_in:          {type: analog, expr: "pump.flow"}
  storagetank.flow_out:         {type: analog, expr: "valve.flow"}
  storagetank.tank_volume:      {type: analog, expr: "storagetank.tank_level * tank.area"}
  storagetank.volume_to_drain:  {type: analog, expr: "storagetank.tank_level * tank.area"}
  storagetank.temperature:      {type: analog, expr: "20"}
  storagetank.emergency_shutoff: {type: binary, expr: "storagetank.tank_level >= 9.5"}
  storagetank.tank_level: {type: analog}
  # inputs published as outputs too: the stock bennu-simulink-provider serves every publishPoints slot, and an unpublished binary
  # input reads "0" (not true/false), which crashes the stock bennu-field-deviced (std::bad_variant_access) when it reads its output tags at start
  pump.control:               {type: binary}
  valve.open:                 {type: binary}
  storagetank.level_setpoint: {type: analog}
  storagetank.fill_control:   {type: binary}
  storagetank.empty_control:  {type: binary}
power:
  tags: pypower
  islands: deenergize
  drive:
    "load-1_bus-3.mw":   "1000 * 9.81 * pump.flow * pump.head / (0.8 * 1e6)"
    "load-1_bus-3.mvar": "`load-1_bus-3`.mw * 0.62"
  inline:
    baseMVA: 100
    buses:    [{id: 1, type: slack, vm: 1.0, base_kv: 13.8}, {id: 2, type: pq, base_kv: 13.8}, {id: 3, type: pq, pd: 0.4, qd: 0.2, base_kv: 13.8}]
    branches: [{from: 1, to: 2, r: 0.01, x: 0.05, rate: 10}, {from: 2, to: 3, r: 0.02, x: 0.08, rate: 10}]
    gens:     [{bus: 1, pg: 0, qg: 0, vg: 1.0, qmax: 50, qmin: -50, pmax: 50, pmin: 0}]
