apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: pump-station-arm64
spec:
  nodes:
  - general:
      hostname: pump-provider
      description: 'Simulink provider: ferrofire solver + pump-station model'
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: mgmt
        address: 172.16.1.2
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
        gateway: 172.16.1.1
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/pump-station-arm64/injects/model.yaml
      dst: /etc/sceptre/model.yaml
      description: model.yaml
      permissions: '0644'
  - general:
      hostname: opc
      description: OPC UA gateway
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: opc-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.50
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.50
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/pump-station-arm64/injects/opc_gateway.json
      dst: /etc/sceptre/opc_gateway.json
      description: opc_gateway.json
      permissions: '0644'
    - src: /phenix/topologies/pump-station-arm64/injects/opcua_gateway.py
      dst: /opt/opcua-gateway/opcua_gateway.py
      description: opcua_gateway.py
      permissions: '0644'
  - general:
      hostname: historian
      description: InfluxDB + telegraf
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: historian-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.60
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.60
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/pump-station-arm64/injects/telegraf.conf
      dst: /etc/telegraf/telegraf.conf
      description: telegraf.conf
      permissions: '0644'
    - src: /phenix/topologies/pump-station-arm64/injects/influx-setup.sh
      dst: /etc/phenix/startup/influx-setup.sh
      description: influx-setup.sh
      permissions: '0644'
  - general:
      hostname: scada-server
      description: FUXA
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: scada-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.71
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.71
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/pump-station-arm64/injects/fuxa_project.json
      dst: /etc/sceptre/fuxa_project.json
      description: fuxa_project.json
      permissions: '0644'
  - general:
      hostname: rtu-1
      description: SCEPTRE RTU
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.101
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
        gateway: 10.1.1.1
      - name: mgmt
        address: 172.16.1.101
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-2
      description: SCEPTRE RTU
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.102
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
        gateway: 10.1.1.1
      - name: mgmt
        address: 172.16.1.102
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: router
      description: Router
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: minirouter
      drives:
      - image: minirouter-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.1
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
      - name: IF1
        address: 10.1.1.1
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
      - name: mgmt
        address: 172.16.1.1
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: Router
