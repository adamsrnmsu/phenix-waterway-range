apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: soap-arm64
spec:
  nodes:
  - general:
      hostname: power-provider
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: &id001
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: mgmt
        address: 172.16.1.2
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-1
    hardware:
      cpu: host
      memory: 1024
      vcpus: 1
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: *id001
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: exp
        address: 10.117.4.101
        mask: 24
        proto: static
        type: ethernet
        vlan: EXP
      - name: mgmt
        address: 172.16.1.4
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-2
    hardware:
      cpu: host
      memory: 1024
      vcpus: 1
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: *id001
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: exp
        address: 10.117.4.102
        mask: 24
        proto: static
        type: ethernet
        vlan: EXP
      - name: mgmt
        address: 172.16.1.5
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-3
    hardware:
      cpu: host
      memory: 1024
      vcpus: 1
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: *id001
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: exp
        address: 10.117.4.103
        mask: 24
        proto: static
        type: ethernet
        vlan: EXP
      - name: mgmt
        address: 172.16.1.6
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-4
    hardware:
      cpu: host
      memory: 1024
      vcpus: 1
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: *id001
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: exp
        address: 10.117.4.104
        mask: 24
        proto: static
        type: ethernet
        vlan: EXP
      - name: mgmt
        address: 172.16.1.7
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: dnp3-master
    hardware:
      cpu: host
      memory: 1024
      vcpus: 1
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced: *id001
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: exp
        address: 10.117.4.110
        mask: 24
        proto: static
        type: ethernet
        vlan: EXP
      - name: mgmt
        address: 172.16.1.20
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
