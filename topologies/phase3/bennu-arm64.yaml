apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: bennu-arm64
spec:
  nodes:
  - general:
      hostname: bennu1
    hardware:
      cpu: host
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: linux
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 192.168.1.1
        mask: 24
        name: if0
        proto: static
        type: ethernet
        vlan: SW1
    type: VirtualMachine
  - general:
      hostname: bennu2
    hardware:
      cpu: host
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
      os_type: linux
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - address: 192.168.1.2
        mask: 24
        name: if0
        proto: static
        type: ethernet
        vlan: SW1
    type: VirtualMachine
