apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: caldera-test
spec:
  nodes:
  - general:
      hostname: caldera
    hardware:
      cpu: host
      memory: 4096
      vcpus: 2
      os_type: linux
      drives:
      - image: caldera-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device usb-kbd,bus=xhci.0
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.9.9.10
        mask: 24
        proto: static
        type: ethernet
        vlan: CTEST
    type: VirtualMachine
  - general:
      hostname: target
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: historian-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device usb-kbd,bus=xhci.0
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.9.9.20
        mask: 24
        proto: static
        type: ethernet
        vlan: CTEST
    type: VirtualMachine
