apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: ffarm64
  annotations:
    topology: ffarm64
spec:
  apps:
  - name: sceptre
    assetDir: /phenix/topologies/ffarm64
    hosts:
    - hostname: ff-provider
      metadata:
        type: provider
        simulator: Ferrofire
        model: /phenix/topologies/ffarm64/injects/model.yaml
        publish_endpoint: udp://*;239.0.0.1:40000
    - hostname: rtu-1
      metadata:
        type: fd-server
        provider: ff-provider
        firmware: ferrofire
        infrastructure: batch-process
        modbus:
        - name: pump
          type: pump
        - name: valve
          type: valve
        - name: storagetank
          type: storagetank
    - hostname: rtu-2
      metadata:
        type: fd-server
        provider: ff-provider
        firmware: ferrofire
        infrastructure: power-transmission
        dnp3:
        - name: bus-1
          type: bus
        - name: generator-1_bus-1
          type: generator
