apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: ffarm64
spec:
  nodes:
  - general:
      hostname: ff-provider
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: mgmt
        address: 172.16.1.2
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-1
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: ferrofire-rtu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.101
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
      - name: mgmt
        address: 172.16.1.101
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-2
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: ferrofire-rtu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.102
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
      - name: mgmt
        address: 172.16.1.102
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: probe
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-ferrofire-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.20
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
    type: VirtualMachine
