# ICCP / TASE.2 (ferrofire-iccp Zeek package, tools/zeek/iccp in ferrofire): mms.log and iccp.log (ww-otj.51).
# Installed by images/malcolm-iccp.sh as logstash/pipelines/zeek/1075_zeek_iccp.conf (bind-mounted into the logstash container).
# Column order = the #fields header of the package's logs; keep in sync with scripts/main.zeek.
# mms.log has its own `service` column (the MMS service, e.g. read): it becomes mms_service so that Malcolm's
# network.protocol (from zeek_cols.service) is the application protocol, mms or iccp.
filter {

  if ([log_source] == "mms") {
    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_mms"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}	%{[zeek_cols][uid]}	%{[zeek_cols][orig_h]}	%{[zeek_cols][orig_p]}	%{[zeek_cols][resp_h]}	%{[zeek_cols][resp_p]}	%{[zeek_cols][is_orig]}	%{[zeek_cols][pdu]}	%{[zeek_cols][mms_service]}	%{[zeek_cols][invoke_id]}	%{[zeek_cols][scope]}	%{[zeek_cols][domain]}	%{[zeek_cols][target]}	%{[zeek_cols][items]}	%{[zeek_cols][values]}	%{[zeek_cols][result]}	%{[zeek_cols][error]}	%{[zeek_cols][rtt]}	%{[zeek_cols][detail]}"
        }
      }
      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_mms"
          split => { "[message]" => "	" }
        }
        ruby {
          id => "ruby_zip_zeek_mms"
          init => "@zeek_mms_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'is_orig', 'pdu', 'mms_service', 'invoke_id', 'scope', 'domain', 'target', 'items', 'values', 'result', 'error', 'rtt', 'detail' ]"
          code => "event.set('[zeek_cols]', @zeek_mms_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }
    else {
      mutate { id => "mutate_rename_zeek_mms_json_service" rename => { "[zeek_cols][service]" => "[zeek_cols][mms_service]" } }
    }
    mutate {
      id => "mutate_add_fields_zeek_mms"
      add_field => {
        "[zeek_cols][proto]" => "tcp"
        "[zeek_cols][service]" => "mms"
      }
    }
  }

  if ([log_source] == "iccp") {
    if ("_jsonparsesuccess" not in [tags]) {
      dissect {
        id => "dissect_zeek_iccp"
        mapping => {
          "[message]" => "%{[zeek_cols][ts]}	%{[zeek_cols][uid]}	%{[zeek_cols][orig_h]}	%{[zeek_cols][orig_p]}	%{[zeek_cols][resp_h]}	%{[zeek_cols][resp_p]}	%{[zeek_cols][invoke_id]}	%{[zeek_cols][op]}	%{[zeek_cols][scope]}	%{[zeek_cols][domain]}	%{[zeek_cols][name]}	%{[zeek_cols][class]}	%{[zeek_cols][vtype]}	%{[zeek_cols][value]}	%{[zeek_cols][quality]}	%{[zeek_cols][result]}	%{[zeek_cols][transfer_set]}	%{[zeek_cols][ds_conditions]}	%{[zeek_cols][timetag]}	%{[zeek_cols][bilateral_table_id]}	%{[zeek_cols][tase2_version]}	%{[zeek_cols][supported_features]}	%{[zeek_cols][supported_blocks]}"
        }
      }
      if ("_dissectfailure" in [tags]) {
        mutate {
          id => "mutate_split_zeek_iccp"
          split => { "[message]" => "	" }
        }
        ruby {
          id => "ruby_zip_zeek_iccp"
          init => "@zeek_iccp_field_names = [ 'ts', 'uid', 'orig_h', 'orig_p', 'resp_h', 'resp_p', 'invoke_id', 'op', 'scope', 'domain', 'name', 'class', 'vtype', 'value', 'quality', 'result', 'transfer_set', 'ds_conditions', 'timetag', 'bilateral_table_id', 'tase2_version', 'supported_features', 'supported_blocks' ]"
          code => "event.set('[zeek_cols]', @zeek_iccp_field_names.zip(event.get('[message]')).to_h)"
        }
      }
    }
    mutate {
      id => "mutate_add_fields_zeek_iccp"
      add_field => {
        "[zeek_cols][proto]" => "tcp"
        "[zeek_cols][service]" => "iccp"
      }
    }
  }

}
